<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Where to place Sampling Trace One Node Setup</title>
  <desc id="desc">Checkpoint MODEL passes through optional patches into the trace node and then KSampler. Checkpoint CLIP passes through the same trace node into positive and negative text encoders.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151b"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8fa3b8"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,sans-serif;fill:#f2f5f8}.sub{font:18px Inter,Segoe UI,sans-serif;fill:#9facba}.node{fill:#242930;stroke:#59636f;stroke-width:2}.trace{fill:#242930;stroke:#65a978;stroke-width:3}.head{font:700 22px Inter,Segoe UI,sans-serif;fill:#f5f7fa}.body{font:17px Inter,Segoe UI,sans-serif;fill:#b9c2cc}.tag{font:700 15px Inter,Segoe UI,sans-serif;fill:#83d59a}.label{font:700 15px Inter,Segoe UI,sans-serif;fill:#bac5d0}.wire{fill:none;stroke:#8fa3b8;stroke-width:4;marker-end:url(#arrow)}.model{stroke:#b78cff}.clip{stroke:#ffd84a}.socketM{fill:#b78cff}.socketC{fill:#ffd84a}.note{font:700 18px Inter,Segoe UI,sans-serif;fill:#f0c36b}.pill{fill:#1a3824;stroke:#65a978;stroke-width:1.5}</style>
  </defs>
  <rect width="1600" height="620" rx="24" fill="url(#bg)"/>
  <text class="title" x="70" y="68">Where to place the trace node</text>
  <text class="sub" x="70" y="102">Keep the sampler. Insert one trace node after the final MODEL patch, and route checkpoint CLIP through the same node.</text>

  <rect class="node" x="70" y="210" width="260" height="180" rx="16"/>
  <text class="head" x="98" y="252">Checkpoint Loader</text>
  <text class="body" x="98" y="294">MODEL</text><circle class="socketM" cx="310" cy="288" r="9"/>
  <text class="body" x="98" y="336">CLIP</text><circle class="socketC" cx="310" cy="330" r="9"/>
  <text class="body" x="98" y="374">VAE stays on its normal path</text>

  <rect class="node" x="415" y="190" width="270" height="130" rx="16"/>
  <text class="head" x="445" y="232">LoRA / IPAdapter</text>
  <text class="body" x="445" y="270">Other MODEL patches</text>
  <text class="body" x="445" y="298">(optional)</text>

  <rect class="trace" x="770" y="165" width="390" height="260" rx="18"/>
  <rect class="pill" x="796" y="188" width="152" height="30" rx="15"/>
  <text class="tag" x="814" y="209">RECOMMENDED</text>
  <text class="head" x="796" y="252">Sampling Trace · One Node Setup</text>
  <circle class="socketM" cx="780" cy="300" r="9"/><text class="body" x="802" y="306">Final MODEL</text>
  <circle class="socketC" cx="780" cy="350" r="9"/><text class="body" x="802" y="356">Checkpoint CLIP</text>
  <text class="body" x="796" y="397">Basic / Advanced stays inside the popup</text>
  <circle class="socketM" cx="1150" cy="300" r="9"/>
  <circle class="socketC" cx="1150" cy="350" r="9"/>

  <rect class="node" x="1260" y="170" width="270" height="130" rx="16"/>
  <text class="head" x="1290" y="215">KSampler</text>
  <text class="body" x="1290" y="254">MODEL input</text>

  <rect class="node" x="1260" y="350" width="270" height="155" rx="16"/>
  <text class="head" x="1290" y="393">Text Encode</text>
  <text class="body" x="1290" y="432">Positive prompt</text>
  <text class="body" x="1290" y="469">Negative prompt</text>

  <path class="wire model" d="M319 288 C360 288 372 255 415 255"/>
  <path class="wire model" d="M685 255 C725 255 730 300 771 300"/>
  <path class="wire clip" d="M319 330 C500 330 590 350 771 350"/>
  <path class="wire model" d="M1159 300 C1200 300 1212 235 1260 235"/>
  <path class="wire clip" d="M1159 350 C1200 350 1212 425 1260 425"/>

  <text class="label" x="360" y="232">MODEL</text>
  <text class="label" x="560" y="360">CLIP</text>
  <text class="label" x="1183" y="271">MODEL</text>
  <text class="label" x="1183" y="399">CLIP</text>
  <text class="note" x="770" y="500">Place this node after the last MODEL patch.</text>
  <text class="sub" x="770" y="536">ControlNet stays on the existing CONDITIONING path.</text>
</svg>
