<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">샘플링 추적 단일 노드 연결 위치</title>
  <desc id="desc">체크포인트 MODEL은 선택적인 패치를 거쳐 추적 노드와 KSampler로 연결하고, 체크포인트 CLIP은 같은 추적 노드를 거쳐 긍정과 부정 텍스트 인코더로 연결합니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151b"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8fa3b8"/>
    </marker>
    <style>
      .title{font:700 34px "Noto Sans KR",Malgun Gothic,Segoe UI,sans-serif;fill:#f2f5f8}.sub{font:18px "Noto Sans KR",Malgun Gothic,Segoe UI,sans-serif;fill:#9facba}.node{fill:#242930;stroke:#59636f;stroke-width:2}.trace{fill:#242930;stroke:#65a978;stroke-width:3}.head{font:700 22px "Noto Sans KR",Malgun Gothic,Segoe UI,sans-serif;fill:#f5f7fa}.body{font:17px "Noto Sans KR",Malgun Gothic,Segoe UI,sans-serif;fill:#b9c2cc}.tag{font:700 15px "Noto Sans KR",Malgun Gothic,Segoe UI,sans-serif;fill:#83d59a}.label{font:700 15px "Noto Sans KR",Malgun Gothic,Segoe UI,sans-serif;fill:#bac5d0}.wire{fill:none;stroke:#8fa3b8;stroke-width:4;marker-end:url(#arrow)}.model{stroke:#b78cff}.clip{stroke:#ffd84a}.socketM{fill:#b78cff}.socketC{fill:#ffd84a}.note{font:700 18px "Noto Sans KR",Malgun Gothic,Segoe UI,sans-serif;fill:#f0c36b}.pill{fill:#1a3824;stroke:#65a978;stroke-width:1.5}</style>
  </defs>
  <rect width="1600" height="620" rx="24" fill="url(#bg)"/>
  <text class="title" x="70" y="68">추적 노드 연결 위치</text>
  <text class="sub" x="70" y="102">기존 샘플러는 그대로 두고, 마지막 MODEL 패치 뒤에 원노드 하나를 넣습니다. 체크포인트 CLIP도 같은 노드로 통과시킵니다.</text>

  <rect class="node" x="70" y="210" width="260" height="180" rx="16"/>
  <text class="head" x="98" y="252">체크포인트 로더</text>
  <text class="body" x="98" y="294">MODEL</text><circle class="socketM" cx="310" cy="288" r="9"/>
  <text class="body" x="98" y="336">CLIP</text><circle class="socketC" cx="310" cy="330" r="9"/>
  <text class="body" x="98" y="374">VAE는 기존 경로 유지</text>

  <rect class="node" x="415" y="190" width="270" height="130" rx="16"/>
  <text class="head" x="445" y="232">LoRA / IPAdapter</text>
  <text class="body" x="445" y="270">기타 MODEL 패치</text>
  <text class="body" x="445" y="298">(선택)</text>

  <rect class="trace" x="770" y="165" width="390" height="260" rx="18"/>
  <rect class="pill" x="796" y="188" width="132" height="30" rx="15"/>
  <text class="tag" x="814" y="209">권장 연결</text>
  <text class="head" x="796" y="252">샘플링 추적 · 단일 노드 설정</text>
  <circle class="socketM" cx="780" cy="300" r="9"/><text class="body" x="802" y="306">최종 MODEL</text>
  <circle class="socketC" cx="780" cy="350" r="9"/><text class="body" x="802" y="356">체크포인트 CLIP</text>
  <text class="body" x="796" y="397">기본/고급은 팝업에서 선택</text>
  <circle class="socketM" cx="1150" cy="300" r="9"/>
  <circle class="socketC" cx="1150" cy="350" r="9"/>

  <rect class="node" x="1260" y="170" width="270" height="130" rx="16"/>
  <text class="head" x="1290" y="215">KSampler</text>
  <text class="body" x="1290" y="254">MODEL 입력</text>

  <rect class="node" x="1260" y="350" width="270" height="155" rx="16"/>
  <text class="head" x="1290" y="393">Text Encode</text>
  <text class="body" x="1290" y="432">긍정 프롬프트</text>
  <text class="body" x="1290" y="469">부정 프롬프트</text>

  <path class="wire model" d="M319 288 C360 288 372 255 415 255"/>
  <path class="wire model" d="M685 255 C725 255 730 300 771 300"/>
  <path class="wire clip" d="M319 330 C500 330 590 350 771 350"/>
  <path class="wire model" d="M1159 300 C1200 300 1212 235 1260 235"/>
  <path class="wire clip" d="M1159 350 C1200 350 1212 425 1260 425"/>

  <text class="label" x="360" y="232">MODEL</text>
  <text class="label" x="560" y="360">CLIP</text>
  <text class="label" x="1183" y="271">MODEL</text>
  <text class="label" x="1183" y="399">CLIP</text>
  <text class="note" x="770" y="500">이 노드는 마지막 MODEL 패치 뒤에 둡니다.</text>
  <text class="sub" x="770" y="536">ControlNet은 기존 CONDITIONING 경로를 그대로 사용합니다.</text>
</svg>
